<!-- @dsCard height=288 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@700&family=IBM+Plex+Sans+Arabic:wght@400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:var(--surface)}
  .cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--surface)}
  svg{position:absolute;inset:0}
  .slab{fill:var(--ink)} .brand{fill:var(--brand)} .accent{fill:var(--accent)} .tint{fill:var(--brand-tint)} .accent-tint{fill:var(--accent-tint)}
  .text{position:absolute;left:48px;bottom:44px;max-width:420px}
  .name{font-family:"Readex Pro",system-ui,sans-serif;font-weight:700;font-size:120px;line-height:.92;color:var(--ink);letter-spacing:-2px}
  .tag{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:14px;line-height:20px;color:var(--ink-muted);margin-top:16px}
</style>
<div class="cover">
  <svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
    <!--
      blocks: ink slab 288x288 (x480), accent 192x144, brand-tint 192x144 — ink, accent, brand-tint, brand
      arrangement: one tall slab with two stacked satellites, flush to the right edge
      pattern: the literal motif — the logo's three rising dots ("two smaller dots trail up to the j's dot: a chart going up")
      steps/radii: blocks on space-24 (96) multiples; dots r 16/28/52 rising at the logo's angle; satellite dot r 24
    -->
    <rect class="slab" x="480" y="0" width="288" height="288"/>
    <circle class="brand" cx="540" cy="228" r="16"/>
    <circle class="brand" cx="590" cy="170" r="28"/>
    <circle class="brand" cx="672" cy="86" r="52"/>
    <rect class="accent" x="768" y="0" width="192" height="144"/>
    <circle class="accent-tint" cx="896" cy="48" r="16"/>
    <rect class="tint" x="768" y="144" width="192" height="144"/>
    <circle class="brand" cx="864" cy="216" r="24"/>
  </svg>
  <div class="text">
    <div class="name">Rawaj</div>
    <div class="tag" dir="rtl" style="text-align:left">رواج — برمجة وإعلانات تصنع الطلب</div>
  </div>
</div>
